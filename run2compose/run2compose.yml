apiVersion: apps/v1
kind: Deployment
metadata:
  name: run2compose
  labels:
    app: run2compose
spec:
  replicas: 2
  selector:
    matchLabels:
      app: run2compose
  template:
    metadata:
      labels:
        app: run2compose
    spec:
      containers:
        - name: run2compose
          image: teeaye205/run2compose:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: run2compose
spec:
  selector:
    app: run2compose
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
